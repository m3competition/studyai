  // ── TYPE D'ACTIVITÉ ──────────────────────────────────────────────────────
  const types = [
    {id:"quiz",label:"Quiz",icon:"🎯"},
    {id:"flashcards",label:"Flashcards",icon:"🃏"},
    {id:"resume",label:"Résumés",icon:"✨"},
    {id:"exam",label:"Examens",icon:"⏱️"},
    {id:"photo_quiz",label:"Scan Quiz",icon:"📸"},
    {id:"photo_flashcards",label:"Scan Flash",icon:"📸"},
    {id:"photo_resume",label:"Scan Résumé",icon:"📸"},
  ];
  const typeCounts = types.map(t=>({...t, count:sessions.filter(s=>s.type===t.id||s.type===("photo_"+t.id.replace("photo_",""))).length})).filter(x=>x.count>0);
  if(typeCounts.length>0){
    const sec4 = D({cls:"rp-section"});
    const t4 = D({cls:"rp-section-title"});
    t4.innerHTML = "🛠️ Activités utilisées";
    sec4.appendChild(t4);
    const maxT = Math.max(...typeCounts.map(x=>x.count));
    typeCounts.forEach(({label,icon,count})=>{
      const row = D({cls:"bar-row"});
      const lbl = D({cls:"bar-label"});lbl.textContent=icon+" "+label;
      const track = D({cls:"bar-track"});
      const fill = D({cls:"bar-fill"});fill.style.width="0%";fill.style.background="var(--info,#5c9dff)";
      track.appendChild(fill);
      const val = D({cls:"bar-val"});val.textContent=count;
      row.append(lbl,track,val);
      sec4.appendChild(row);
      setTimeout(()=>{fill.style.width=Math.round(count/maxT*100)+"%";},50);
    });
    w.appendChild(sec4);
  }

  // ── BADGES ───────────────────────────────────────────────────────────────
  const BADGES = [
    {icon:"🚀",name:"Démarrage",desc:"1ère session",unlocked:sessions.length>=1},
    {icon:"🔥",name:"En feu",desc:"3 jours de suite",unlocked:streak>=3},
    {icon:"💪",name:"Assidu",desc:"10 sessions",unlocked:sessions.length>=10},
    {icon:"🎯",name:"Tireur d'élite",desc:"Score 80%+ à un exam",unlocked:sessions.some(s=>s.score>=80)},
    {icon:"📚",name:"Polyvalent",desc:"3 matières différentes",unlocked:new Set(sessions.map(s=>s.matiere)).size>=3},
    {icon:"⚡",name:"Speedrun",desc:"Mode exam complété",unlocked:sessions.some(s=>s.type==="exam")},
    {icon:"🏆",name:"Champion",desc:"Score 100% à un exam",unlocked:sessions.some(s=>s.score===100)},
    {icon:"📸",name:"Photo pro",desc:"Scan devoir utilisé",unlocked:sessions.some(s=>s.type&&s.type.startsWith("photo"))},
  ];

  const sec5 = D({cls:"rp-section"});
  const t5 = D({cls:"rp-section-title"});
  t5.innerHTML = "🏅 Badges ("+(BADGES.filter(b=>b.unlocked).length)+"/"+BADGES.length+" débloqués)";
  sec5.appendChild(t5);
  const badgeGrid = D({cls:"badge-grid"});
  BADGES.forEach(b=>{
    const bi = D({cls:"badge-item"+(b.unlocked?" unlocked":"")});
    bi.innerHTML = "<div class='bi' style='opacity:"+(b.unlocked?1:0.25)+"'>"+b.icon+"</div><div class='bn'>"+b.name+"</div><div class='bd'>"+b.desc+"</div>";
    if(!b.unlocked) bi.style.filter="grayscale(1)";
    badgeGrid.appendChild(bi);
  });
  sec5.appendChild(badgeGrid);
  w.appendChild(sec5);

  return w;
}

// RÉPÉTITION ESPACÉE (Algorithme SM-2)
// ══════════════════════════════════════════════════════════════════════════════

// Card data: {id, front, back, matiere, deckId}
// Card SRS state: {easeFactor, interval, repetitions, nextReview, lastRating}
// easeFactor starts at 2.5, interval in days

function srsGetDecks(){return lsGet("sai_srs_decks",[]);}
function srsSetDecks(d){lsSet("sai_srs_decks",d);}
function srsGetCards(){return lsGet("sai_srs_cards",[]);}
function srsSetCards(c){lsSet("sai_srs_cards",c);}
function srsGetStates(){return lsGet("sai_srs_states",{});}
function srsSetStates(s){lsSet("sai_srs_states",s);}

function srsToday(){return new Date().toISOString().slice(0,10);}

// SM-2 algorithm
// rating: 0=blackout, 1=hard, 2=good, 3=easy
function sm2Update(state, rating){
  let {easeFactor=2.5, interval=1, repetitions=0} = state||{};
  const q = [0,3,4,5][rating]; // map to SM-2 quality 0-5
  if(q < 3){
    repetitions = 0;
    interval = 1;
  } else {
    if(repetitions === 0) interval = 1;
    else if(repetitions === 1) interval = 6;
    else interval = Math.round(interval * easeFactor);
    repetitions++;
  }
  easeFactor = Math.max(1.3, easeFactor + 0.1 - (5-q)*(0.08+(5-q)*0.02));
  const nextDate = new Date();
  nextDate.setDate(nextDate.getDate() + interval);
  return {
    easeFactor: Math.round(easeFactor*100)/100,
    interval,
    repetitions,
    nextReview: nextDate.toISOString().slice(0,10),
    lastRating: rating
  };
}

function srsDueCount(deckId){
  const cards = srsGetCards().filter(c=>c.deckId===deckId);
  const states = srsGetStates();
  const today = srsToday();
  return cards.filter(c=>{
    const st = states[c.id];
    return !st || st.nextReview <= today;
  }).length;
}

function renderSRS(){
  const w = D({cls:"fade"});
  let view = "decks"; // decks | study | addCards
  let activeDeck = null;
  let studyQueue = [];
  let studyIdx = 0;
  let revealed = false;
  let sessionDone = 0;

  const userMats = MATIERES.filter(m=>S.user.matieres.includes(m.id));

  function build(){
    w.innerHTML="";
    if(view==="decks") buildDecks();
    else if(view==="study") buildStudy();
    else if(view==="addCards") buildAddCards();
  }

  // ── DECKS LIST ────────────────────────────────────────────────────────────
  function buildDecks(){
    const decks = srsGetDecks();
    const cards = srsGetCards();
    const today = srsToday();

    w.appendChild(makeTitle("Répétition espacée 🔁"));
    w.appendChild(makeSub("Révise au bon moment. L'algo SM-2 (comme Anki) planifie tes cartes automatiquement."));

    // Total due badge
    const totalDue = decks.reduce((a,d)=>a+srsDueCount(d.id),0);
    if(totalDue > 0){
      const dueBanner = D({style:"background:var(--gd);border:1px solid var(--g2);border-radius:10px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:12px"});
      dueBanner.innerHTML = "<div style='font-size:24px'>🔔</div><div><div style='font-size:15px;font-weight:700;color:var(--g)'>"+totalDue+" carte"+(totalDue>1?"s":"")+" à réviser aujourd'hui!</div><div style='font-size:13px;color:var(--t2)'>Révise maintenant pendant que c'est encore frais.</div></div>";
      w.appendChild(dueBanner);
    }

    // New deck button
    const newBtn = B({cls:"btn",style:"width:100%;padding:13px;font-size:15px;margin-bottom:16px",
      onClick:()=>{view="addCards";activeDeck=null;build();}
    });
    newBtn.innerHTML = "+ Créer un paquet de cartes";
    w.appendChild(newBtn);

    if(decks.length === 0){
      const es = D({cls:"srs-empty"});
      es.innerHTML = "<div class='se-icon'>🃏</div><div class='se-title'>Aucun paquet encore</div><div class='se-sub'>Crée ton premier paquet en collant tes notes — l'IA génère les cartes automatiquement.</div>";
      w.appendChild(es);
      return;
    }

    decks.forEach(deck=>{
      const due = srsDueCount(deck.id);
      const total = cards.filter(c=>c.deckId===deck.id).length;
      const mat = MATIERES.find(m=>m.id===deck.matiere);
      const card = D({cls:"srs-deck", onClick:()=>{
        if(due > 0){activeDeck=deck;view="study";buildStudyQueue();build();}
        else{
          // Show deck options even if no cards due
          activeDeck=deck;view="study";buildStudyQueue(true);build();
        }
      }});
      card.innerHTML = "<div class='dk-icon'>"+(mat?.e||"🃏")+"</div><div class='dk-info'><div class='dk-name'>"+deck.name+"</div><div class='dk-sub'>"+total+" carte"+(total!==1?"s":"")+" · "+deck.matiere_nom+"</div></div>";
      const dueBadge = D({cls:"srs-due"+(due===0?" done":"")});
      dueBadge.textContent = due > 0 ? due+" à réviser" : "✓ À jour";
      card.appendChild(dueBadge);
      w.appendChild(card);
    });
  }

  // ── BUILD STUDY QUEUE ─────────────────────────────────────────────────────
  function buildStudyQueue(forceAll=false){
    const cards = srsGetCards().filter(c=>c.deckId===activeDeck.id);
    const states = srsGetStates();
    const today = srsToday();
    if(forceAll){
      studyQueue = [...cards].sort(()=>Math.random()-0.5);
    } else {
      studyQueue = cards.filter(c=>{
        const st = states[c.id];
        return !st || st.nextReview <= today;
      }).sort(()=>Math.random()-0.5);
    }
    studyIdx = 0;
    revealed = false;
    sessionDone = 0;
  }

  // ── STUDY SESSION ─────────────────────────────────────────────────────────
  function buildStudy(){
    if(!activeDeck){view="decks";build();return;}

    // Session complete
    if(studyIdx >= studyQueue.length){
      const es = D({cls:"srs-empty"});
      const pct = studyQueue.length > 0 ? Math.round(sessionDone/studyQueue.length*100) : 100;

      if(studyQueue.length === 0){
        es.innerHTML = "<div class='se-icon'>✅</div><div class='se-title'>Tout est à jour!</div><div class='se-sub'>Toutes les cartes de ce paquet sont révisées.<br>Reviens demain pour la prochaine session.</div>";
      } else {
        es.innerHTML = "<div class='se-icon'>"+(pct>=80?"🏆":pct>=50?"🎯":"💪")+"</div><div class='se-title'>Session terminée!</div><div class='se-sub'>"+studyQueue.length+" cartes révisées · "+sessionDone+" maîtrisées</div>";
      }
      w.appendChild(es);

      const row = D({style:"display:flex;gap:10px;margin-top:8px"});
      row.appendChild(B({cls:"btn-ghost",style:"flex:1",onClick:()=>{view="decks";build();}},"← Mes paquets"));
      if(studyQueue.length>0) row.appendChild(B({cls:"btn",style:"flex:1",onClick:()=>{buildStudyQueue();build();}},"Recommencer"));
      w.appendChild(row);
      return;
    }

    const card = studyQueue[studyIdx];
    const states = srsGetStates();
    const state = states[card.id];
    const isNew = !state;

    // Header
    const hdr = D({style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"});
    const backBtn = B({cls:"btn-ghost",style:"font-size:13px",onClick:()=>{view="decks";build();}});
    backBtn.textContent="← "+activeDeck.name;
    hdr.appendChild(backBtn);
    const prog = mk("span",{cls:"badge"},""+(studyIdx+1)+"/"+studyQueue.length);
    hdr.appendChild(prog);
    w.appendChild(hdr);

    // Progress bar
    w.appendChild(makeProgress(Math.round(studyIdx/studyQueue.length*100)));

    // New card badge
    if(isNew){
      const nb = D({cls:"srs-new-badge"});
      nb.innerHTML = "✨ Nouvelle carte";
      w.appendChild(nb);
    } else if(state?.interval){
      const nb = D({cls:"srs-new-badge"});
      nb.innerHTML = "🔁 Intervalle: "+state.interval+" jour"+(state.interval>1?"s":"");
      w.appendChild(nb);
    }

    // Flip card
    const fc = D({cls:"srs-card"+(revealed?" revealed":""),onClick:()=>{
      if(!revealed){revealed=true;build();}
    }});
    const hint = D({cls:"srs-card-hint"});
    hint.textContent = revealed ? "RÉPONSE" : "TAP POUR RÉVÉLER";
    const txt = D({cls:"srs-card-text"});
    txt.textContent = revealed ? card.back : card.front;
    fc.append(hint,txt);
    if(!revealed){
      const tapHint = D({style:"position:absolute;bottom:14px;font-size:11px;color:var(--t3)"});
      tapHint.textContent="ou appuie sur Espace";
      fc.appendChild(tapHint);
    }
    w.appendChild(fc);

    // Keyboard shortcut
    const keyHandler = (e)=>{
      if(e.code==="Space"&&!revealed){e.preventDefault();revealed=true;build();}
      if(revealed){
        if(e.key==="1")rateCard(0);
        if(e.key==="2")rateCard(1);
        if(e.key==="3")rateCard(2);
        if(e.key==="4")rateCard(3);
      }
    };
    document.addEventListener("keydown",keyHandler,{once:true});

    if(!revealed){
      const kbHint = D({style:"text-align:center;color:var(--t3);font-size:12px;margin-bottom:8px"});
      kbHint.textContent="Espace pour révéler";
      w.appendChild(kbHint);
      return;
    }

    // Rating buttons
    const ratings = D({cls:"srs-rating"});
    const btns = [
      {label:"Raté",sub:"< 1j",color:"var(--red)",bg:"#1e0808",r:0},
      {label:"Difficile",sub:"~1j",color:"#ffb830",bg:"#1e1200",r:1},
      {label:"Bien",sub:"~"+Math.max(1,Math.round((state?.interval||1)*2.5))+"j",color:"#5c9dff",bg:"#0a1220",r:2},
      {label:"Facile",sub:"~"+Math.max(1,Math.round((state?.interval||1)*(state?.easeFactor||2.5)))+"j",color:"var(--g)",bg:"var(--gd)",r:3},
    ];
    btns.forEach(({label,sub,color,bg,r})=>{
      const b = B({cls:"srs-btn",style:"background:"+bg+";border:1.5px solid "+color+";color:"+color,
        onClick:()=>rateCard(r)});
      b.innerHTML = "<span>"+label+"</span><span class='sb-label'>"+sub+"</span>";
      ratings.appendChild(b);
    });
    w.appendChild(ratings);

    // Progress boxes
    const prow = D({cls:"srs-progress-row"});
    const done2 = studyIdx;
    const remaining = studyQueue.length - studyIdx;
    [{v:done2,l:"Révisées"},{v:remaining,l:"Restantes"},{v:sessionDone,l:"Maîtrisées"}].forEach(({v,l})=>{
      const pb = D({cls:"srs-pbox"});
      pb.innerHTML = "<div class='spv'>"+v+"</div><div class='spl'>"+l+"</div>";
      prow.appendChild(pb);
    });
    w.appendChild(prow);
  }

  function rateCard(rating){
    const card = studyQueue[studyIdx];
    const states = srsGetStates();
    const newState = sm2Update(states[card.id], rating);
    states[card.id] = newState;
    srsSetStates(states);
    if(rating >= 2) sessionDone++;
    studyIdx++;
    revealed = false;
    build();
  }

  // ── ADD CARDS ─────────────────────────────────────────────────────────────
  function buildAddCards(){
    let deckName = activeDeck?.name || "";
    let deckMatiere = activeDeck?.matiere || (userMats[0]?.id||"math");
    let notes = "";
    let imgFile = null;
    let generating = false;

    w.appendChild(makeTitle(activeDeck?"Ajouter des cartes":"Nouveau paquet 🃏"));
    w.appendChild(makeSub("Colle tes notes — l'IA crée les cartes automatiquement."));

    // Deck name (only for new deck)
    if(!activeDeck){
      const nc = D({cls:"card"});
      nc.appendChild(mk("label",{cls:"lbl"},"Nom du paquet (ex: Chimie chap.3)"));
      const nameInp = I({type:"text",placeholder:"Nom de ton paquet...",style:"margin-top:2px"});
      nameInp.addEventListener("input",e=>{deckName=e.target.value;updateGenBtn();});
      nc.appendChild(nameInp);
      w.appendChild(nc);

      // Matiere
      const mc = D({cls:"card"});
      mc.appendChild(mk("label",{cls:"lbl"},"Matière"));
      mc.appendChild(makePillRow(userMats.map(m=>({id:m.id,label:m.e+" "+m.nom})),deckMatiere,v=>{deckMatiere=v;}));
      w.appendChild(mc);
    }

    // Notes with photo
    const {container:notesCard, getState:getNS} = makeNotesWithPhoto("",20,(n,f)=>{
      notes=n;imgFile=f;
      updateGenBtn();
    });
    w.appendChild(notesCard);

    // Nb cards slider
    let nbCards = 8;
    const sc = D({cls:"card"});
    const nlbl = mk("label",{cls:"lbl"});
    nlbl.textContent="Nombre de cartes à générer : ";
    const nval = mk("strong",{style:"color:var(--text)"},String(nbCards));
    nlbl.appendChild(nval);
    sc.appendChild(nlbl);
    const rng = I({type:"range",min:5,max:20,value:nbCards,step:1,style:"width:100%"});
    rng.addEventListener("input",e=>{nbCards=+e.target.value;nval.textContent=nbCards;});
    sc.appendChild(rng);
    w.appendChild(sc);

    const row = D({style:"display:flex;gap:10px"});
    row.appendChild(B({cls:"btn-ghost",style:"flex:0 0 auto",onClick:()=>{view="decks";build();}},"← Retour"));

    // Update genBtn state now that it exists
    function updateGenBtn(){if(genBtn) genBtn.disabled=(!activeDeck&&deckName.trim().length<2)||(notes.trim().length<20&&!imgFile);}

    const genBtn = B({cls:"btn",disabled:true,style:"flex:1;padding:13px;font-size:15px",
      onClick:async()=>{
        genBtn.disabled=true;
        genBtn.innerHTML="<span class='spinner'></span>Génération des cartes...";
        const {notes:cn,imgFile:cf}=getNS();
        if(cn.trim().length>=20) notes=cn;
        if(cf) imgFile=cf;
        try{
          const txt = await callAI(
            "Tu es un expert pédagogique. Crée exactement "+nbCards+" flashcards de haute qualité en français québécois à partir de ces notes.\n\nNotes:\n"+notes+"\n\nRègles importantes:\n- Le RECTO doit être un terme précis, une question courte, ou un concept clé\n- Le VERSO doit être la définition claire, la réponse complète, ou l'explication en 1-3 phrases\n- Varie les types: définitions, exemples, formules, comparaisons, causes/effets\n- Couvre les points les plus importants\n\nJSON UNIQUEMENT:\n[{\"front\":\"Recto de la carte\",\"back\":\"Verso de la carte\"}]",
            imgFile||null
          );
          const newCards = JSON.parse(txt);

          // Create or update deck
          const decks = srsGetDecks();
          const allCards = srsGetCards();
          const mat = MATIERES.find(m=>m.id===deckMatiere);

          let deck;
          if(activeDeck){
            deck = activeDeck;
          } else {
            deck = {id:"deck_"+Date.now(),name:deckName.trim(),matiere:deckMatiere,matiere_nom:mat?.nom||deckMatiere,created:new Date().toISOString()};
            decks.push(deck);
            srsSetDecks(decks);
          }

          // Add cards with unique IDs
          const today = srsToday();
          const cardsToAdd = newCards.map((c,i)=>({
            id:"card_"+Date.now()+"_"+i,
            front:c.front,back:c.back,
            deckId:deck.id,matiere:deckMatiere,
            created:today
          }));
          srsSetCards([...allCards,...cardsToAdd]);

          addSession({type:"srs_add",matiere:deckMatiere,date:new Date().toISOString(),nb:cardsToAdd.length});

          // Go straight to study
          activeDeck=deck;view="study";buildStudyQueue();build();
        }catch(e){
          alert("Erreur: "+e.message);
          genBtn.disabled=false;genBtn.textContent="🃏 Générer les cartes";
        }
    }});
    genBtn.textContent="🃏 Générer les cartes";
    row.appendChild(genBtn);
    w.appendChild(row);
  }

  build();
  return w;
}

// RENDER
// ══════════════════════════════════════════════════════════════════════════════
function render(){
  const root=document.getElementById("app");
  root.innerHTML="";
  if(!S.seenLanding){root.appendChild(renderLanding());return;}
  if(!S.user){root.appendChild(renderOnboarding());return;}
  root.appendChild(renderSidebar());
  const main=D({cls:"main"});
  const pages={dashboard:renderDashboard,quiz:renderQuiz,flashcards:renderFlashcards,resume:renderResume,photo:renderPhoto,prof:renderProf,plan:renderPlan,srs:renderSRS,exam:renderExam,rapport:renderRapport,historique:renderHistorique};
  main.appendChild((pages[S.page]||renderDashboard)());
  root.appendChild(main);
}

render();
