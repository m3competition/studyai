<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyAI</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--bg2:#161616;--bg3:#1f1f1f;
  --border:#2a2a2a;--border2:#3a3a3a;
  --text:#f0ede8;--t2:#888;--t3:#555;
  --g:#7fff6b;--gd:#1a3316;--g2:#3aab2a;--red:#ff5c5c;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6}
#app{display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;flex-shrink:0;position:fixed;top:0;bottom:0;left:0;overflow-y:auto}
.logo{font-size:20px;font-weight:800;color:var(--g);margin-bottom:26px;padding:0 8px}
.logo span{color:var(--text)}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--t2);background:transparent;border:none;cursor:pointer;width:100%;text-align:left;margin-bottom:2px;transition:all 0.1s;font-family:inherit}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:var(--gd);color:var(--g)}
.user-info{padding:10px 11px;background:var(--bg3);border-radius:8px;margin-top:auto}
.user-name{font-size:13px;font-weight:600}
.user-level{font-size:11px;color:var(--t3);margin-top:2px}
.main{margin-left:200px;padding:30px 36px;flex:1;overflow-y:auto}
h1.page-title{font-size:24px;font-weight:800;letter-spacing:-0.02em;margin-bottom:5px}
.sub{color:var(--t2);font-size:14px;margin-bottom:26px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px}
.lbl{font-size:12px;color:var(--t2);display:block;margin-bottom:8px;font-weight:500}
input[type=text],input[type=password],textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:10px 13px;font-size:14px;width:100%;font-family:inherit;outline:none;transition:border-color 0.15s}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--g)}
textarea{resize:vertical;min-height:150px;line-height:1.6}
.btn{background:var(--g);color:#000;font-weight:700;padding:11px 20px;border-radius:8px;font-size:14px;border:none;cursor:pointer;font-family:inherit;transition:all 0.15s}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--t2);padding:9px 16px;border-radius:8px;border:1px solid var(--border2);font-size:13px;cursor:pointer;font-family:inherit}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.pill{background:var(--bg3);border:1.5px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--t2);cursor:pointer;font-family:inherit;transition:all 0.15s}
.pill.on{background:var(--gd);border-color:var(--g);color:var(--g)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--gd);color:var(--g)}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--g);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.prog-wrap{background:var(--bg3);border-radius:20px;height:4px;overflow:hidden;margin-bottom:20px}
.prog-fill{background:var(--g);height:100%;border-radius:20px;transition:width 0.4s}
.q-opt{background:var(--bg3);border:1.5px solid var(--border2);border-radius:8px;padding:12px 15px;cursor:pointer;font-size:14px;text-align:left;color:var(--text);transition:all 0.15s;width:100%;margin-bottom:7px;font-family:inherit}
.q-opt:hover:not([disabled]){border-color:var(--g);background:var(--gd)}
.q-opt.correct{background:var(--gd)!important;border-color:var(--g)!important;color:var(--g)!important}
.q-opt.wrong{background:#1e0808!important;border-color:var(--red)!important;color:var(--red)!important}
.q-opt.dim{opacity:0.35}
.flip-card{background:var(--bg2);border:1.5px solid var(--border2);border-radius:12px;padding:36px 28px;text-align:center;cursor:pointer;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 0.2s;margin-bottom:14px}
.flip-card.revealed{background:var(--gd);border-color:var(--g)}
.hint{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px}
.sum-sec{border-left:3px solid var(--g);padding-left:14px;margin-bottom:18px}
.kp{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px}
.kn{width:20px;height:20px;background:var(--gd);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--g);font-weight:700;flex-shrink:0;margin-top:2px}
.onb-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.onb-box{max-width:460px;width:100%}
.step-dots{display:flex;gap:6px;margin-bottom:32px}
.dot{height:4px;border-radius:2px;background:var(--border);transition:all 0.3s}
.lvl-btn{background:var(--bg2);border:1.5px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--t2);text-align:left;font-size:14px;cursor:pointer;font-family:inherit;transition:all 0.15s;width:100%;margin-bottom:7px}
.lvl-btn:hover,.lvl-btn.on{background:var(--gd);border-color:var(--g);color:var(--g)}
.mat-btn{background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:14px 12px;cursor:pointer;text-align:left;font-family:inherit;transition:all 0.15s}
.mat-btn:hover,.mat-btn.on{background:var(--gd);border-color:var(--g)}
.big-num{font-size:28px;font-weight:800;color:var(--g)}
.info-box{background:var(--gd);border:1px solid var(--g2);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.upload-zone{border:2px dashed var(--border2);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:14px;background:var(--bg2)}
.upload-zone:hover,.upload-zone.has-img{border-color:var(--g);background:var(--gd)}
.fade{animation:fadeUp 0.25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.exam-setup-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:14px}
.exam-hero{text-align:center;padding:32px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin-bottom:20px}
.exam-big{font-size:72px;font-weight:800;color:var(--g);letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums}
.exam-big.warn{color:#ffb830}
.exam-big.danger{color:var(--red);animation:pulse 0.5s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:0.5}}
.exam-label{font-size:13px;color:var(--t2);margin-top:8px;text-transform:uppercase;letter-spacing:0.06em}
.score-big{font-size:80px;font-weight:800;letter-spacing:-0.04em;line-height:1}
.score-wrap{text-align:center;padding:36px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin-bottom:20px}
.medal{font-size:56px;margin-bottom:8px}
.xp-pill{display:inline-block;background:var(--gd);color:var(--g);border:1px solid var(--g2);border-radius:20px;padding:5px 16px;font-size:14px;font-weight:700;margin-top:10px}
.review-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.review-q{font-size:14px;font-weight:600;margin-bottom:10px;line-height:1.5}
.review-opt{font-size:13px;padding:8px 12px;border-radius:7px;margin-bottom:5px}
.review-opt.correct{background:var(--gd);color:var(--g)}
.review-opt.wrong{background:#1e0808;color:var(--red)}
.review-opt.neutral{color:var(--t2)}
.review-exp{font-size:12px;color:var(--t2);margin-top:8px;padding:8px 10px;background:var(--bg3);border-radius:6px;line-height:1.6}
.confetti-wrap{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden}
.conf{position:absolute;top:-10px;width:10px;height:10px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.difficulty-btn{background:var(--bg3);border:1.5px solid var(--border2);border-radius:10px;padding:14px;cursor:pointer;text-align:center;font-family:inherit;transition:all 0.15s;flex:1}
.difficulty-btn:hover,.difficulty-btn.on{border-color:var(--g);background:var(--gd)}
.difficulty-btn .diff-icon{font-size:24px;margin-bottom:6px}
.difficulty-btn .diff-name{font-size:13px;font-weight:600;color:var(--text)}
.difficulty-btn .diff-desc{font-size:11px;color:var(--t3);margin-top:3px}
.stat-row{display:flex;gap:10px;margin-bottom:20px}
.stat-box{flex:1;background:var(--bg3);border-radius:8px;padding:12px;text-align:center}
.stat-box .sv{font-size:22px;font-weight:800;color:var(--g)}
.stat-box .sl{font-size:11px;color:var(--t3);margin-top:3px}

.notes-wrap{position:relative}
.photo-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.photo-bar-btn{background:var(--bg3);border:1.5px solid var(--border2);border-radius:7px;padding:6px 12px;font-size:12px;color:var(--t2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:all 0.15s}
.photo-bar-btn:hover{border-color:var(--g);color:var(--g)}
.photo-preview-strip{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--gd);border:1px solid var(--g2);border-radius:8px;margin-bottom:8px;font-size:13px;color:var(--g)}
.photo-preview-strip img{height:44px;border-radius:5px;object-fit:cover}
.photo-preview-strip .rm{background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;margin-left:auto;padding:0 4px}
.plan-day{background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.plan-day-hdr{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;transition:background 0.15s}
.plan-day-hdr:hover{background:var(--bg3)}
.plan-day-hdr .day-badge{background:var(--gd);color:var(--g);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;flex-shrink:0}
.plan-day-hdr .day-title{font-size:14px;font-weight:600;flex:1}
.plan-day-hdr .day-time{font-size:12px;color:var(--t3)}
.plan-day-hdr .day-arrow{color:var(--t3);transition:transform 0.2s;font-size:16px}
.plan-day-body{display:none;padding:0 16px 14px;border-top:1px solid var(--border)}
.plan-day-body.open{display:block}
.plan-task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.plan-task:last-child{border-bottom:none}
.plan-task-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.plan-task-check.done{background:var(--g);border-color:var(--g);color:#000;font-size:12px}
.plan-task-text{font-size:13px;line-height:1.6;color:var(--t2)}
.plan-task-text.done{text-decoration:line-through;color:var(--t3)}
.plan-hero{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px;display:flex;align-items:center;gap:20px}
.plan-progress-ring{position:relative;width:80px;height:80px;flex-shrink:0}
.plan-ring-svg{transform:rotate(-90deg)}
.plan-stat{text-align:center}
.plan-stat .pv{font-size:28px;font-weight:800;color:var(--g)}
.plan-stat .pl{font-size:11px;color:var(--t3);margin-top:2px}
.exam-date-inp{background:var(--bg3);border:1.5px solid var(--border2);border-radius:8px;color:var(--text);padding:10px 13px;font-size:15px;font-family:inherit;outline:none;width:100%;transition:border-color 0.15s}
.exam-date-inp:focus{border-color:var(--g)}

.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 120px);max-width:720px}
.chat-messages{flex:1;overflow-y:auto;padding:4px 0;display:flex;flex-direction:column;gap:12px}
.chat-msg{display:flex;gap:10px;align-items:flex-start;animation:fadeUp 0.2s ease}
.chat-msg.user{flex-direction:row-reverse}
.chat-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;margin-top:2px}
.chat-avatar.ai{background:var(--gd);border:1px solid var(--g2)}
.chat-avatar.user{background:var(--bg3);border:1px solid var(--border2)}
.chat-bubble{max-width:80%;padding:12px 15px;border-radius:12px;font-size:14px;line-height:1.7}
.chat-bubble.ai{background:var(--bg2);border:1px solid var(--border);border-radius:4px 12px 12px 12px}
.chat-bubble.user{background:var(--gd);border:1px solid var(--g2);border-radius:12px 4px 12px 12px;text-align:right}
.chat-bubble.typing{color:var(--t2)}
.chat-img-preview{max-width:200px;border-radius:8px;margin-top:6px;display:block}
.chat-input-wrap{display:flex;gap:8px;align-items:flex-end;padding-top:12px;border-top:1px solid var(--border);margin-top:8px}
.chat-input{flex:1;background:var(--bg3);border:1.5px solid var(--border2);border-radius:10px;color:var(--text);padding:11px 14px;font-size:14px;font-family:inherit;outline:none;resize:none;min-height:44px;max-height:120px;transition:border-color 0.15s;line-height:1.5}
.chat-input:focus{border-color:var(--g)}
.chat-send{background:var(--g);color:#000;border:none;border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.chat-send:hover{background:var(--g2)}
.chat-send:disabled{opacity:0.4;cursor:not-allowed}
.chat-tools{display:flex;gap:6px;margin-bottom:8px}
.chat-tool{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--t2);cursor:pointer;font-family:inherit;transition:all 0.15s}
.chat-tool:hover{border-color:var(--g);color:var(--g)}
.chat-ctx-badge{display:inline-flex;align-items:center;gap:5px;background:var(--gd);border:1px solid var(--g2);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--g);margin-bottom:8px}
.chat-ctx-badge .rm{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:0 2px}

.rp-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.rp-stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.rp-stat .rv{font-size:30px;font-weight:800;color:var(--g);line-height:1}
.rp-stat .rl{font-size:11px;color:var(--t3);margin-top:5px;text-transform:uppercase;letter-spacing:0.04em}
.rp-section{margin-bottom:28px}
.rp-section-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{width:110px;font-size:13px;color:var(--t2);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:var(--bg3);border-radius:20px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;transition:width 0.6s ease;background:var(--g)}
.bar-val{width:36px;text-align:right;font-size:12px;font-weight:600;color:var(--text);flex-shrink:0}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week-day{aspect-ratio:1;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--t3)}
.week-day.active{background:var(--gd);color:var(--g);border:1px solid var(--g2)}
.week-day.today{background:var(--g);color:#000;font-weight:700}
.week-day.empty{background:var(--bg3)}
.streak-fire{font-size:40px;margin-bottom:4px}
.score-history{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px}
.score-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.score-bar-fill{width:100%;border-radius:4px 4px 0 0;background:var(--g);transition:height 0.4s ease;min-height:4px}
.score-bar-lbl{font-size:9px;color:var(--t3)}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center}
.badge-item.unlocked{border-color:var(--g);background:var(--gd)}
.badge-item .bi{font-size:26px;margin-bottom:5px}
.badge-item .bn{font-size:11px;font-weight:600;color:var(--t2)}
.badge-item.unlocked .bn{color:var(--g)}
.badge-item .bd{font-size:10px;color:var(--t3);margin-top:2px}
.empty-state{text-align:center;padding:32px;color:var(--t3);font-size:14px}
.empty-state .ei{font-size:40px;margin-bottom:10px}
.rp-tip{background:var(--gd);border:1px solid var(--g2);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--t2);line-height:1.7}
.rp-tip strong{color:var(--g)}

.srs-deck{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.15s}
.srs-deck:hover{border-color:var(--border2);transform:translateY(-1px)}
.srs-deck .dk-icon{font-size:26px;flex-shrink:0}
.srs-deck .dk-info{flex:1}
.srs-deck .dk-name{font-size:14px;font-weight:600;margin-bottom:3px}
.srs-deck .dk-sub{font-size:12px;color:var(--t3)}
.srs-due{background:var(--gd);color:var(--g);border:1px solid var(--g2);border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;flex-shrink:0}
.srs-due.urgent{background:#2a1010;color:var(--red);border-color:var(--red)}
.srs-due.done{background:var(--bg3);color:var(--t3);border-color:var(--border)}
.srs-card{background:var(--bg2);border:1.5px solid var(--border2);border-radius:14px;padding:40px 28px;text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:16px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.srs-card.revealed{background:var(--gd);border-color:var(--g)}
.srs-card-hint{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px}
.srs-card-text{font-size:18px;font-weight:600;line-height:1.6;color:var(--text)}
.srs-card.revealed .srs-card-text{font-weight:400;color:#c8f5c0;font-size:16px}
.srs-rating{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.srs-btn{border:none;border-radius:10px;padding:12px 8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.srs-btn:hover{transform:translateY(-2px)}
.srs-btn .sb-label{font-size:11px;font-weight:400;opacity:0.8}
.srs-new-badge{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--t2);margin-bottom:14px}
.srs-empty{text-align:center;padding:40px 20px}
.srs-empty .se-icon{font-size:56px;margin-bottom:12px}
.srs-empty .se-title{font-size:20px;font-weight:700;margin-bottom:6px}
.srs-empty .se-sub{color:var(--t2);font-size:14px;line-height:1.6}
.srs-progress-row{display:flex;gap:8px;margin-bottom:20px}
.srs-pbox{flex:1;background:var(--bg3);border-radius:8px;padding:10px;text-align:center}
.srs-pbox .spv{font-size:20px;font-weight:800;color:var(--g)}
.srs-pbox .spl{font-size:11px;color:var(--t3);margin-top:2px}

/* ── LANDING PAGE ── */
.landing{min-height:100vh;background:#050505;color:#f0ede8;overflow-x:hidden;position:relative;width:100%;box-sizing:border-box}
.landing *{box-sizing:border-box}
.ln-nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:linear-gradient(to bottom,rgba(5,5,5,0.95),transparent);box-sizing:border-box}

<script>

];
const NIVEAUX = ["Secondaire 1","Secondaire 2","Secondaire 3","Secondaire 4","Secondaire 5","Cégep 1","Cégep 2"];

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

const S = {
  page: "dashboard",
  user: lsGet("sai_user", null),
  sessions: lsGet("sai_sessions", []),
  seenLanding: false,
};

function go(page){S.page=page;render();}
function addSession(s){S.sessions=[...S.sessions,s];lsSet("sai_sessions",S.sessions);}

// ══════════════════════════════════════════════════════════════════════════════
// AI
// ══════════════════════════════════════════════════════════════════════════════
async function fileToB64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

async function callAI(prompt, imgFile=null){
  let body;
  if(imgFile){
    const b64 = await fileToB64(imgFile);
    const mime = imgFile.type || "image/jpeg";
    body = {prompt, image:{data:b64, mime}, model:"vision"};
  } else {
    body = {prompt, model:"text"};
  }
  const r = await fetch("/api/ai",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  const d = await r.json();
  if(d.error) throw new Error(d.error);
  return cleanJSON(d.result);
}

function cleanJSON(raw){
  // Strip markdown fences
  let s = raw.replace(/```json|```/g,"").trim();
  // Extract first JSON array or object
  const arrMatch = s.match(/\[[\s\S]*\]/);
  const objMatch = s.match(/\{[\s\S]*\}/);
  if(arrMatch && objMatch){
    s = arrMatch.index < objMatch.index ? arrMatch[0] : objMatch[0];
  } else if(arrMatch){
    s = arrMatch[0];
  } else if(objMatch){
    s = objMatch[0];
  }
  // Remove trailing commas before ] or }
  s = s.replace(/,(\s*[}\]])/g, "$1");
  // Remove control characters that break JSON
  s = s.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"");
  // Try to parse — if it fails, throw clear error
  try {
    JSON.parse(s);
  } catch(e) {
    // Last resort: truncate at last valid closing bracket
    const lastArr = s.lastIndexOf("]");
    const lastObj = s.lastIndexOf("}");
    const cut = Math.max(lastArr, lastObj);
    if(cut > 0){
      s = s.slice(0, cut+1);
      // Fix trailing comma before cut
      s = s.replace(/,(\s*[}\]])/g,"$1");
    }
    // Validate again — if still broken, throw useful message
    try { JSON.parse(s); }
    catch(e2){ throw new Error("L'IA a retourné un format invalide. Réessaie — ça arrive parfois avec de très longues notes."); }
  }
  return s;
}

// ══════════════════════════════════════════════════════════════════════════════
// DOM HELPERS
// ══════════════════════════════════════════════════════════════════════════════
function mk(tag,props,...kids){
  const e=document.createElement(tag);
  if(props) Object.entries(props).forEach(([k,v])=>{
    if(k==="cls") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(),v);
    else e[k]=v;
  });
  kids.flat().forEach(c=>{if(c!=null) e.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return e;
}
const D=(p,...c)=>mk("div",p,...c);
const B=(p,...c)=>mk("button",p,...c);
const I=(p)=>mk("input",p);
const TA=(p)=>mk("textarea",p);

function makeTitle(txt){return mk("h1",{cls:"page-title"},txt);}
function makeSub(txt){const e=mk("p",{cls:"sub"});e.textContent=txt;return e;}

function makeProgress(pct){
  const w=D({cls:"prog-wrap"});
  const f=D({cls:"prog-fill"});f.style.width=pct+"%";
  w.appendChild(f);return w;
}

function makePillRow(items, current, onChange){
  const row=D({style:"display:flex;flex-wrap:wrap;gap:7px"});
  items.forEach(item=>{
    const b=B({cls:"pill"+(current===item.id?" on":"")});
    b.textContent=item.label;
    b.addEventListener("click",()=>{
      row.querySelectorAll(".pill").forEach(x=>x.className="pill");
      b.className="pill on";
      onChange(item.id);
    });
    row.appendChild(b);
  });
  return row;
}

function makeFlipCards(cards, onDone){
  let idx=0,rev=false,known=[];
  const w=D({cls:"fade"});

  function build(){
    w.innerHTML="";
    if(idx>=cards.length){
      const nbK=known.filter(Boolean).length;
      const c=D({cls:"card",style:"text-align:center;padding:32px"});
      c.innerHTML="<div style='font-size:48px;font-weight:800;color:var(--g)'>"+nbK+"/"+cards.length+"</div><div style='color:var(--t2);margin-top:6px'>cartes maîtrisées</div>";
      w.appendChild(c);
      w.appendChild(B({cls:"btn",style:"width:100%",onClick:onDone},"Nouvelle session"));
      return;
    }
    const c=cards[idx];
    w.appendChild(makeProgress(Math.round(idx/cards.length*100)));
    const fc=D({cls:"flip-card"+(rev?" revealed":""),onClick:()=>{rev=!rev;build();}});
    const hint=D({cls:"hint"});
    hint.textContent=rev?"RÉPONSE":"RECTO — clique pour retourner";
    const txt=D({style:"font-size:16px;font-weight:"+(rev?"400":"600")+";line-height:1.6;color:"+(rev?"#c8f5c0":"var(--text)")});
    txt.textContent=rev?c.back:c.front;
    fc.append(hint,txt);
    w.appendChild(fc);
    if(rev){
      const row=D({style:"display:flex;gap:10px"});
      row.appendChild(B({style:"flex:1;background:#1e0808;border:1.5px solid var(--red);border-radius:8px;color:var(--red);padding:12px;cursor:pointer;font-family:inherit",
        onClick:()=>{known.push(false);rev=false;idx++;build();}},"😓 À revoir"));
      row.appendChild(B({style:"flex:1;background:var(--gd);border:1.5px solid var(--g);border-radius:8px;color:var(--g);padding:12px;cursor:pointer;font-family:inherit",
        onClick:()=>{known.push(true);rev=false;idx++;build();}},"✓ Je connais"));
      w.appendChild(row);
    } else {
      const hint2=mk("p",{style:"text-align:center;color:var(--t3);font-size:12px"},"Clique sur la carte pour voir la réponse");
      w.appendChild(hint2);
    }
  }
  build();
  return w;
}

function makeQuizGame(questions, onDone){
  let cur=0,sel=null,rev=false,score=0;
  const w=D({cls:"fade"});

  function build(){
    w.innerHTML="";
    if(cur>=questions.length){
      const pct=Math.round(score/questions.length*100);
      const c=D({cls:"card",style:"text-align:center;padding:32px;margin-bottom:14px"});
      c.innerHTML="<div style='font-size:52px;font-weight:800;color:"+(pct>=70?"var(--g)":"#ffb830")+"'>"+pct+"%</div><div style='font-size:17px;font-weight:600;margin:8px 0'>"+score+"/"+questions.length+" bonnes réponses</div><div style='color:var(--t2);font-size:13px'>"+(pct>=80?"Excellent! 🔥":pct>=60?"Bonne progression 👍":"Continue à réviser 💪")+"</div>";
      w.appendChild(c);
      w.appendChild(B({cls:"btn",style:"width:100%",onClick:onDone},"Nouveau quiz"));
      return;
    }
    const q=questions[cur];
    const tr=D({style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"});
    tr.appendChild(mk("span",{cls:"badge"},""+(cur+1)+"/"+questions.length));
    w.appendChild(tr);
    w.appendChild(makeProgress(Math.round(cur/questions.length*100)));
    const qc=D({cls:"card"});
    const qp=mk("p",{style:"font-size:15px;font-weight:600;line-height:1.5;margin:0"});
    qp.textContent=q.q;
    qc.appendChild(qp);w.appendChild(qc);
    q.opts.forEach((o,i)=>{
      let cls="q-opt";
      if(rev) cls+=(i===q.correct?" correct":i===sel?" wrong":" dim");
      const b=B({cls});b.textContent=o;
      if(!rev) b.addEventListener("click",()=>{sel=i;rev=true;if(i===q.correct)score++;build();});
      w.appendChild(b);
    });
    if(rev){
      const ec=D({cls:"card",style:"border-left:3px solid var(--g);margin-bottom:12px"});
      const es=mk("span",{style:"color:var(--g);font-weight:600"},"💡 ");
      const et=document.createTextNode(q.exp);
      ec.append(es,et);w.appendChild(ec);
      w.appendChild(B({cls:"btn",style:"width:100%",onClick:()=>{cur++;sel=null;rev=false;build();}},
        cur+1<questions.length?"Question suivante →":"Voir les résultats"));
    }
  }
  build();
  return w;
}

// ── NOTES + PHOTO HELPER ─────────────────────────────────────────────────────
// Returns {container, getState} where state = {notes, imgFile}
function makeNotesWithPhoto(initialNotes, minLen, onUpdate){
  let notes=initialNotes||"", imgFile=null;
  const wrap=D({cls:"card"});
  wrap.appendChild(mk("label",{cls:"lbl"},"Tes notes de cours"));

  // Photo bar
  const bar=D({cls:"photo-bar"});
  const fileInp=I({type:"file",accept:"image/*",style:"display:none"});
  fileInp.addEventListener("change",e=>{
    const f=e.target.files[0];
    if(!f)return;
    imgFile=f;
    renderPreview();
  });

  const photoBtn=B({cls:"photo-bar-btn",onClick:()=>fileInp.click()});
  photoBtn.innerHTML="📁 Fichier";
  const camBtn=B({cls:"photo-bar-btn",onClick:()=>{
    const ci=I({type:"file",accept:"image/*",style:"display:none"});
    ci.setAttribute("capture","environment");
    ci.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;imgFile=f;renderPreview();});
    document.body.appendChild(ci);ci.click();
  }});
  camBtn.innerHTML="📸 Caméra";
  const pasteBtn=B({cls:"photo-bar-btn"});
  pasteBtn.innerHTML="📋 Coller capture";
  pasteBtn.title="Colle une capture d'écran (Ctrl+V après avoir copié)";
  pasteBtn.addEventListener("click",async()=>{
    try{
      const items=await navigator.clipboard.read();
      for(const item of items){
        const imgType=item.types.find(t=>t.startsWith("image/"));
        if(imgType){
          const blob=await item.getType(imgType);
          imgFile=new File([blob],"capture.png",{type:imgType});
          renderPreview();return;
        }
      }
      alert("Aucune image dans le presse-papier. Fais d'abord Ctrl+PrtSc ou copie une image.");
    }catch(e){
      // Fallback: listen for paste event on textarea
      pasteBtn.textContent="📋 Fais Ctrl+V ici...";
      ta2.focus();
      const handler=ev=>{
        const items2=[...(ev.clipboardData?.items||[])];
        const imgItem=items2.find(i=>i.type.startsWith("image/"));
        if(imgItem){ev.preventDefault();imgFile=imgItem.getAsFile();renderPreview();}
        pasteBtn.innerHTML="📋 Coller capture";
        ta2.removeEventListener("paste",handler);
      };
      ta2.addEventListener("paste",handler);
    }
  });
  bar.append(fileInp,photoBtn,camBtn,pasteBtn);
  wrap.appendChild(bar);

  // Global paste listener on textarea for screenshots
  wrap.addEventListener("paste",ev=>{
    const items2=[...(ev.clipboardData?.items||[])];
    const imgItem=items2.find(i=>i.type.startsWith("image/"));
    if(imgItem){ev.preventDefault();imgFile=imgItem.getAsFile();renderPreview();}
  });

  // Preview strip
  let previewStrip=null;
  function renderPreview(){
    if(previewStrip){previewStrip.remove();previewStrip=null;}
    if(imgFile){
      previewStrip=D({cls:"photo-preview-strip"});
      const img=document.createElement("img");
      img.src=URL.createObjectURL(imgFile);
      const name=mk("span",{},"✓ "+imgFile.name.slice(0,28)+(imgFile.name.length>28?"...":"")+" — sera analysée par l'IA");
      const rm=B({cls:"rm",onClick:()=>{imgFile=null;renderPreview();if(onUpdate)onUpdate(notes,null);}});
      rm.textContent="✕";
      previewStrip.append(img,name,rm);
      ta2.before(previewStrip);
    }
    if(onUpdate)onUpdate(notes,imgFile);
  }

  const ta2=TA({placeholder:"Colle ici ton cours, ou utilise la caméra pour prendre une photo..."});
  ta2.value=notes;
  ta2.style.minHeight="130px";
  ta2.addEventListener("input",e=>{notes=e.target.value;if(onUpdate)onUpdate(notes,imgFile);});
  wrap.appendChild(ta2);

  return {container:wrap, getState:()=>({notes,imgFile})};
}


// ══════════════════════════════════════════════════════════════════════════════
// ONBOARDING
// ══════════════════════════════════════════════════════════════════════════════
function renderOnboarding(){
  let step=0,nom="",niveau="",mats=[];
  const wrap=D({cls:"onb-wrap fade"});
  const box=D({cls:"onb-box"});
  wrap.appendChild(box);

  function dots(){
    const d=D({cls:"step-dots"});
    [0,1,2].forEach(i=>{
      const dot=document.createElement("div");
      dot.className="dot";
      dot.style.width=(i===step?"26px":"10px");
      dot.style.background=(i<=step?"var(--g)":"var(--border)");
      d.appendChild(dot);
    });
    return d;
  }

  function renderStep(){
    box.innerHTML="";
    box.appendChild(dots());

    if(step===0){
      const logo=D({html:"<div style='font-size:40px;font-weight:800;letter-spacing:-0.04em;margin-bottom:12px'><span style='color:var(--g)'>Study</span>AI</div>"});
      const desc=mk("p",{style:"color:var(--t2);margin-bottom:28px;line-height:1.6"},"Colle tes notes. L'IA génère des quiz, flashcards et résumés en quelques secondes.");
      const lbl=mk("label",{cls:"lbl"},"Comment tu t'appelles?");
      const inp2=I({type:"text",placeholder:"Ton prénom...",value:nom,style:"font-size:18px;margin-bottom:18px"});
      inp2.addEventListener("input",e=>{nom=e.target.value;sb.disabled=nom.trim().length<2;});
      inp2.addEventListener("keydown",e=>{if(e.key==="Enter"&&nom.trim().length>=2){step=1;renderStep();}});
      const sb=B({cls:"btn",style:"width:100%;padding:13px;font-size:15px",disabled:nom.trim().length<2,
        onClick:()=>{step=1;renderStep();}},"Commencer →");
      box.append(logo,desc,lbl,inp2,sb);
      setTimeout(()=>inp2.focus(),50);

    } else if(step===1){
      box.appendChild(D({html:"<h2 style='font-size:22px;font-weight:800;margin-bottom:5px'>Ton niveau scolaire</h2><p style='color:var(--t2);font-size:14px;margin-bottom:18px'>On adapte les explications à ton niveau.</p>"}));
      NIVEAUX.forEach(n=>{
        const b=B({cls:"lvl-btn"+(niveau===n?" on":""),onClick:()=>{
          niveau=n;
          box.querySelectorAll(".lvl-btn").forEach(x=>x.className="lvl-btn");
          b.className="lvl-btn on";
          nb.disabled=false;
        }});
        b.textContent=n;box.appendChild(b);
      });
      const row=D({style:"display:flex;gap:10px;margin-top:12px"});
      row.appendChild(B({cls:"btn-ghost",onClick:()=>{step=0;renderStep();}},"← Retour"));
      const nb=B({cls:"btn",disabled:!niveau,style:"flex:1",onClick:()=>{step=2;renderStep();}},"Continuer →");
      row.appendChild(nb);box.appendChild(row);

    } else {
      box.appendChild(D({html:"<h2 style='font-size:22px;font-weight:800;margin-bottom:5px'>Tes matières</h2><p style='color:var(--t2);font-size:14px;margin-bottom:18px'>Choisis celles que tu études.</p>"}));
      const grid=D({cls:"g2"});
      MATIERES.forEach(m=>{
        const b=B({cls:"mat-btn"+(mats.includes(m.id)?" on":""),onClick:()=>{
          if(mats.includes(m.id)) mats=mats.filter(x=>x!==m.id);
          else mats.push(m.id);
          b.className="mat-btn"+(mats.includes(m.id)?" on":"");
          const nm=b.querySelector(".mn");
          if(nm) nm.style.color=mats.includes(m.id)?"var(--g)":"var(--t2)";
          db.disabled=mats.length===0;
        }});
        b.innerHTML="<div style='font-size:22px;margin-bottom:5px'>"+m.e+"</div><div class='mn' style='font-size:12px;font-weight:600;color:"+(mats.includes(m.id)?"var(--g)":"var(--t2)")+"'>"+m.nom+"</div>";
        grid.appendChild(b);
      });
      box.appendChild(grid);
      const row=D({style:"display:flex;gap:10px;margin-top:18px"});
      row.appendChild(B({cls:"btn-ghost",onClick:()=>{step=1;renderStep();}},"← Retour"));
      const db=B({cls:"btn",disabled:mats.length===0,style:"flex:1",onClick:()=>{
        const user={nom,niveau,matieres:mats};
        lsSet("sai_user",user);S.user=user;S.page="dashboard";render();
      }},"Lancer StudyAI 🚀");
      row.appendChild(db);box.appendChild(row);
    }
  }
  renderStep();
  return wrap;
}

function renderQuiz(){
  let notes="",matiere=S.user.matieres[0]||"math",nb=5,questions=null,imgFile=null;

    w.appendChild(mc);

    const {container:nc,getState:getNS}=makeNotesWithPhoto(notes,30,(n,f)=>{notes=n;imgFile=f;gb.disabled=notes.trim().length<30&&!f;});

    const sc=D({cls:"card"});

    rng.addEventListener("input",e=>{nb=+e.target.value;nval.textContent=nb;});
    sc.appendChild(rng);w.appendChild(sc);

    const gb=B({cls:"btn",disabled:notes.trim().length<30,style:"width:100%;padding:13px;font-size:15px",
      onClick:async()=>{
        gb.disabled=true;gb.innerHTML="<span class='spinner'></span>Génération en cours...";
        try{
          const {notes:cn,imgFile:cf}=getNS();if(cn.trim().length>=30)notes=cn;if(cf)imgFile=cf;
          const txt=await callAI("Génère exactement "+nb+" questions QCM en français québécois depuis ces notes.\n\nNotes:\n"+notes+"\n\nJSON UNIQUEMENT:\n[{\"q\":\"Question?\",\"opts\":[\"A) op1\",\"B) op2\",\"C) op3\",\"D) op4\"],\"correct\":0,\"exp\":\"Explication courte.\"}]\n\ncorrect = index 0-3.",imgFile||null);
          questions=JSON.parse(txt);
          addSession({type:"quiz",matiere,date:new Date().toISOString()});
          showGame();
        }catch(e){alert("Erreur: "+e.message);gb.disabled=false;gb.textContent="🎯 Générer le quiz";}

    w.innerHTML="";

    const game=makeQuizGame(questions,()=>{questions=null;showForm();});

  }

  showForm();
  return w;
}

// SCAN DEVOIR (PHOTO)
// ══════════════════════════════════════════════════════════════════════════════
function renderPhoto(){
  let imgFile=null,previewUrl=null,mode="quiz",result=null;
  const w=D({cls:"fade"});

  function showForm(){
    w.innerHTML="";
    w.appendChild(makeTitle("Scan devoir 📸"));
    w.appendChild(makeSub("Prends en photo ton devoir ou cours. L'IA analyse et génère un outil de révision."));

    // Upload zone
    const uz=D({cls:"upload-zone"+(previewUrl?" has-img":"")});
    if(previewUrl){
      const img=document.createElement("img");
      img.src=previewUrl;
      img.style.cssText="max-width:100%;max-height:260px;border-radius:8px;display:block;margin:0 auto 12px";
      uz.appendChild(img);
      const ch=D({style:"font-size:13px;color:var(--g);cursor:pointer"});
      ch.textContent="✓ Image chargée — clique pour changer";
      uz.appendChild(ch);
    } else {
      uz.innerHTML="<div style='font-size:42px;margin-bottom:10px'>📸</div><div style='font-size:15px;font-weight:600;margin-bottom:6px'>Dépose une photo ici</div><div style='font-size:13px;color:var(--t2);margin-bottom:14px'>ou clique pour choisir une image</div><div style='display:inline-block;background:var(--g);color:#000;font-weight:700;padding:9px 20px;border-radius:8px;font-size:13px'>Choisir une image 📁</div><div style='margin-top:10px;font-size:11px;color:var(--t3)'>JPG, PNG — Photo de devoir, cours, tableau...</div>";
    }

    const fi=I({type:"file",accept:"image/*",style:"display:none"});
    fi.addEventListener("change",e=>{
      const f=e.target.files[0];
      if(!f)return;
      imgFile=f;previewUrl=URL.createObjectURL(f);showForm();
    });
    uz.addEventListener("click",()=>fi.click());
    uz.addEventListener("dragover",e=>{e.preventDefault();});
    uz.addEventListener("drop",e=>{
      e.preventDefault();
      const f=e.dataTransfer.files[0];
      if(f&&f.type.startsWith("image/")){imgFile=f;previewUrl=URL.createObjectURL(f);showForm();}
    });
    w.appendChild(fi);
    w.appendChild(uz);

    // Camera button
    const cb=B({style:"width:100%;background:var(--bg3);border:1.5px solid var(--border2);border-radius:8px;padding:11px;color:var(--t2);font-family:inherit;cursor:pointer;font-size:14px;margin-bottom:14px",
      onClick:()=>{
        const ci=I({type:"file",accept:"image/*",style:"display:none"});
        ci.setAttribute("capture","environment");
        ci.addEventListener("change",e=>{
          const f=e.target.files[0];
          if(!f)return;
          imgFile=f;previewUrl=URL.createObjectURL(f);showForm();
        });
        document.body.appendChild(ci);ci.click();
    }});
    cb.textContent="📷 Prendre une photo avec la caméra";
    w.appendChild(cb);

    if(imgFile){
      const mc=D({cls:"card",style:"margin-bottom:14px"});
      mc.appendChild(mk("label",{cls:"lbl"},"Que veux-tu générer depuis cette image?"));
      mc.appendChild(makePillRow(
        [{id:"quiz",label:"🎯 Quiz"},{id:"flashcards",label:"🃏 Flashcards"},{id:"resume",label:"✨ Résumé"}],
        mode, v=>{mode=v;}
      ));
      w.appendChild(mc);

      const ab=B({cls:"btn",style:"width:100%;padding:13px;font-size:15px",onClick:async()=>{
        ab.disabled=true;ab.innerHTML="<span class='spinner'></span>Analyse de l'image en cours...";
        try{
          let prompt="";
          if(mode==="quiz") prompt="Regarde cette image de cours et génère exactement 5 QCM en français québécois.\n\nJSON:\n[{\"q\":\"Question?\",\"opts\":[\"A) op1\",\"B) op2\",\"C) op3\",\"D) op4\"],\"correct\":0,\"exp\":\"Explication.\"}]\n\nUNIQUEMENT le JSON.";
          else if(mode==="flashcards") prompt="Regarde cette image de cours et crée 6 flashcards en français québécois.\n\nJSON:\n[{\"front\":\"Terme\",\"back\":\"Définition en 1-2 phrases\"}]\n\nUNIQUEMENT le JSON.";
          else prompt="Regarde cette image de cours et génère un résumé structuré en français québécois.\n\nJSON:\n{\"titre\":\"Titre\",\"idee\":\"Idée principale.\",\"sections\":[{\"titre\":\"Titre\",\"contenu\":\"Contenu.\"}],\"points\":[\"Point 1\",\"Point 2\",\"Point 3\"],\"conseil\":\"Conseil.\"}\n\nUNIQUEMENT le JSON.";
          const txt=await callAI(prompt,imgFile);
          result=JSON.parse(txt);
          addSession({type:"photo_"+mode,matiere:"scan",date:new Date().toISOString()});
          showResult();
        }catch(e){alert("Erreur: "+e.message);ab.disabled=false;ab.textContent="🔍 Analyser l'image";}
      }});
      ab.textContent="🔍 Analyser l'image";
      w.appendChild(ab);
    }
  }

  function showResult(){
    w.innerHTML="";
    const tr=D({style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"});
    tr.appendChild(mk("span",{cls:"badge"},"📸 Analyse terminée"));
    tr.appendChild(B({cls:"btn-ghost",onClick:()=>{result=null;showForm();}},"Nouveau scan"));
    w.appendChild(tr);

    if(mode==="quiz"){
      w.appendChild(makeQuizGame(result,()=>{result=null;showForm();}));
    } else if(mode==="flashcards"){
      w.appendChild(makeFlipCards(result,()=>{result=null;showForm();}));
    } else {
      const ic=D({cls:"card",style:"border-left:3px solid var(--g);margin-bottom:16px"});
      const t1=D({style:"font-size:11px;color:var(--g);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:7px"});
      t1.textContent="Contenu détecté";
      const t2=mk("p",{style:"font-size:14px;line-height:1.7;margin:0;color:var(--t2)"});
      t2.textContent=result.idee||"";
      ic.append(t1,t2);w.appendChild(ic);

      if(result.sections) result.sections.forEach(s=>{
        const sc=D({cls:"sum-sec"});
        const sl=D({style:"font-size:11px;color:var(--g);font-weight:700;text-transform:uppercase;margin-bottom:6px"});sl.textContent=s.titre;
        const sp=mk("p",{style:"font-size:13px;color:var(--t2);line-height:1.7;margin:0"});sp.textContent=s.contenu;
        sc.append(sl,sp);w.appendChild(sc);
      });

      if(result.points){
        const kc=D({cls:"card",style:"margin-bottom:14px"});
        const kl=D({style:"font-size:11px;color:var(--g);font-weight:700;text-transform:uppercase;margin-bottom:12px"});kl.textContent="Points clés";
        kc.appendChild(kl);
        result.points.forEach((pt,i)=>{
          const kp=D({cls:"kp"});
          const kn=D({cls:"kn"});kn.textContent=i+1;
          const ks=mk("span",{style:"font-size:13px;color:var(--t2)"});ks.textContent=pt;
          kp.append(kn,ks);kc.appendChild(kp);
        });
        w.appendChild(kc);
      }
    }
  }

  showForm();
  return w;
}

// MODE EXAM
// ══════════════════════════════════════════════════════════════════════════════
function renderExam(){
  let phase="setup";
  let notes="", matiere=S.user.matieres[0]||"math", difficulty="normal", examImg=null;
  let questions=[], current=0, answers=[], timeLeft=0, totalTime=0, timerInterval=null;
  const DIFFICULTIES={
    easy:{label:"Facile",icon:"😊",desc:"5 questions · 3 min",nb:5,minutes:3},
    normal:{label:"Normal",icon:"🎯",desc:"8 questions · 5 min",nb:8,minutes:5},
    hard:{label:"Difficile",icon:"🔥",desc:"12 questions · 7 min",nb:12,minutes:7},
    exam:{label:"Exam réel",icon:"💀",desc:"15 questions · 10 min",nb:15,minutes:10},
  };
  const MEDALS=[
    {min:90,medal:"🏆",label:"Parfait!",color:"var(--g)"},
    {min:70,medal:"🥇",label:"Excellent!",color:"var(--g)"},
    {min:50,medal:"🥈",label:"Bien joué",color:"#ffb830"},
    {min:0,medal:"💪",label:"Continue!",color:"var(--red)"},
  ];
  const userMats=MATIERES.filter(m=>S.user.matieres.includes(m.id));
  const w=D({cls:"fade"});

  function confetti(count=60){
    const colors=["#7fff6b","#ffb830","#5c9dff","#ff5c5c","#d45cff","#fff"];
    const wrap=D({cls:"confetti-wrap"});
    document.body.appendChild(wrap);
    for(let i=0;i<count;i++){
      const c=D({cls:"conf"});
      c.style.left=Math.random()*100+"vw";
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.width=(6+Math.random()*8)+"px";
      c.style.height=(6+Math.random()*8)+"px";
      c.style.animationDuration=(1.5+Math.random()*2)+"s";
      c.style.animationDelay=(Math.random()*0.8)+"s";
      wrap.appendChild(c);
    }
    setTimeout(()=>wrap.remove(),3500);
  }

  function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}

  function fmtTime(s){
    const m=Math.floor(s/60);
    const sec=s%60;
    return m+":"+(sec<10?"0":"")+sec;
  }

  function getMedal(pct){return MEDALS.find(m=>pct>=m.min);}

  function build(){
    stopTimer();
    w.innerHTML="";

    if(phase==="setup") buildSetup();
    else if(phase==="loading") buildLoading();
    else if(phase==="playing") buildPlaying();
    else if(phase==="results") buildResults();
  }

  // ── SETUP ─────────────────────────────────────────────────────────────────
  function buildSetup(){
    w.appendChild(makeTitle("Mode Exam ⏱️"));
    w.appendChild(makeSub("Simule un vrai examen. Chrono. Pression. Résultat."));

    // Matiere
    const mc=D({cls:"exam-setup-card"});
    mc.appendChild(mk("label",{cls:"lbl"},"Matière"));
    mc.appendChild(makePillRow(userMats.map(m=>({id:m.id,label:m.e+" "+m.nom})),matiere,v=>{matiere=v;}));
    w.appendChild(mc);

    // Notes
    const {container:nc,getState:getNS}=makeNotesWithPhoto(notes,30,(n,f)=>{notes=n;examImg=f;startBtn.disabled=notes.trim().length<30&&!f;});
    nc.className="exam-setup-card";
    w.appendChild(nc);

    // Difficulty
    const dc=D({cls:"exam-setup-card"});
    dc.appendChild(mk("label",{cls:"lbl"},"Difficulté"));
    const drow=D({style:"display:flex;gap:10px"});
    Object.entries(DIFFICULTIES).forEach(([k,v])=>{
      const b=B({cls:"difficulty-btn"+(difficulty===k?" on":""),onClick:()=>{
        difficulty=k;
        drow.querySelectorAll(".difficulty-btn").forEach(x=>x.className="difficulty-btn");
        b.className="difficulty-btn on";
      }});
      b.innerHTML="<div class='diff-icon'>"+v.icon+"</div><div class='diff-name'>"+v.label+"</div><div class='diff-desc'>"+v.desc+"</div>";
      drow.appendChild(b);
    });
    dc.appendChild(drow);
    w.appendChild(dc);

    const startBtn=B({cls:"btn",disabled:notes.trim().length<30,style:"width:100%;padding:15px;font-size:16px",
      onClick:async()=>{
        phase="loading";build();
        const diff=DIFFICULTIES[difficulty];
        try{
          const {notes:cn,imgFile:cf}=getNS();if(cn.trim().length>=30)notes=cn;if(cf)examImg=cf;
          const txt=await callAI("Tu es un professeur d'examen. Génère exactement "+diff.nb+" questions QCM sur ces notes. Questions pièges avec 3 mauvaises réponses plausibles.\n\nNotes:\n"+notes+"\n\nJSON UNIQUEMENT:\n[{\"q\":\"Question?\",\"opts\":[\"A) op1\",\"B) op2\",\"C) op3\",\"D) op4\"],\"correct\":0,\"exp\":\"Explication courte.\"}]",examImg||null);
          questions=JSON.parse(txt);
          current=0;answers=[];
          totalTime=diff.minutes*60;timeLeft=totalTime;
          phase="playing";build();
        }catch(e){alert("Erreur IA: "+e.message);phase="setup";build();}
    }});
    startBtn.textContent="Commencer l'examen →";
    w.appendChild(startBtn);
  }

  // ── LOADING ───────────────────────────────────────────────────────────────
  function buildLoading(){
    const diff=DIFFICULTIES[difficulty];
    w.appendChild(D({style:"text-align:center;padding:60px 20px"}));
    w.lastChild.innerHTML="<div style='font-size:48px;margin-bottom:20px;animation:pulse 1s infinite alternate'>⏳</div><div style='font-size:20px;font-weight:700;margin-bottom:10px'>Préparation de ton examen...</div><div style='color:var(--t2);font-size:14px'>"+diff.nb+" questions · "+diff.minutes+" minutes · Bonne chance!</div>";
  }

  // ── PLAYING ───────────────────────────────────────────────────────────────
  function buildPlaying(){
    const q=questions[current];
    const pct=Math.round(current/questions.length*100);
    const timePct=timeLeft/totalTime;

    // Header row
    const hdr=D({style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"});
    const qinfo=D({});
    qinfo.innerHTML="<div style='font-size:13px;color:var(--t2)'>Question <strong style='color:var(--text)'>"+(current+1)+"</strong> / "+questions.length+"</div>";
    hdr.appendChild(qinfo);

    // Timer display
    const timerEl=D({cls:"exam-big"+(timeLeft<=30?" danger":timeLeft<=60?" warn":""),style:"font-size:36px"});
    timerEl.textContent=fmtTime(timeLeft);
    hdr.appendChild(timerEl);
    w.appendChild(hdr);

    // Progress bar
    const prog=D({cls:"prog-wrap"});
    const fill=D({cls:"prog-fill"});fill.style.width=pct+"%";
    fill.style.background=timePct<0.2?"var(--red)":timePct<0.4?"#ffb830":"var(--g)";
    prog.appendChild(fill);w.appendChild(prog);

    // Question card
    const qc=D({cls:"card",style:"margin-bottom:16px;border-left:3px solid var(--g)"});
    const qp=mk("p",{style:"font-size:16px;font-weight:600;line-height:1.5;margin:0"});
    qp.textContent=q.q;qc.appendChild(qp);w.appendChild(qc);

    // Options
    q.opts.forEach((o,i)=>{
      const b=B({cls:"q-opt",onClick:()=>{
        stopTimer();
        answers.push({q:current,chosen:i,correct:q.correct,q_text:q.q,opts:q.opts,exp:q.exp});
        if(current+1>=questions.length){
          addSession({type:"exam",matiere,difficulty,date:new Date().toISOString(),score:Math.round(answers.filter(a=>a.chosen===a.correct).length/questions.length*100)});
          phase="results";build();
        } else {
          current++;build();
        }
      }});
      b.textContent=o;w.appendChild(b);
    });

    // Skip button (counts as wrong)
    const skip=B({cls:"btn-ghost",style:"width:100%;margin-top:6px;font-size:13px",onClick:()=>{
      answers.push({q:current,chosen:-1,correct:q.correct,q_text:q.q,opts:q.opts,exp:q.exp});
      if(current+1>=questions.length){
        addSession({type:"exam",matiere,difficulty,date:new Date().toISOString(),score:Math.round(answers.filter(a=>a.chosen===a.correct).length/questions.length*100)});
        phase="results";build();
      } else {current++;build();}
    }});
    skip.textContent="Passer cette question →";
    w.appendChild(skip);

    // Start/continue timer
    timerInterval=setInterval(()=>{
      timeLeft--;
      // Update timer display only (no full rebuild for perf)
      const tel=w.querySelector(".exam-big");
      if(tel){
        tel.textContent=fmtTime(timeLeft);
        tel.className="exam-big"+(timeLeft<=30?" danger":timeLeft<=60?" warn":"");
      }
      // Update progress fill color
      const f2=w.querySelector(".prog-fill");
      const tp2=timeLeft/totalTime;
      if(f2) f2.style.background=tp2<0.2?"var(--red)":tp2<0.4?"#ffb830":"var(--g)";

      if(timeLeft<=0){
        stopTimer();
        // Time up — fill remaining as wrong
        while(current<questions.length){
          const qq=questions[current];
          answers.push({q:current,chosen:-1,correct:qq.correct,q_text:qq.q,opts:qq.opts,exp:qq.exp});
          current++;
        }
        addSession({type:"exam",matiere,difficulty,date:new Date().toISOString(),score:Math.round(answers.filter(a=>a.chosen===a.correct).length/questions.length*100)});
        phase="results";build();
      }
    },1000);
  }

  // ── RESULTS ───────────────────────────────────────────────────────────────
  function buildResults(){
    const correct=answers.filter(a=>a.chosen===a.correct).length;
    const total=answers.length;
    const pct=Math.round(correct/total*100);
    const medal=getMedal(pct);
    const timeUsed=totalTime-timeLeft;
    const xp=Math.round(pct*DIFFICULTIES[difficulty].nb*0.5);

    // Confetti si bon score
    if(pct>=70) setTimeout(()=>confetti(pct>=90?100:60),100);

    // Score hero
    const hero=D({cls:"score-wrap"});
    hero.innerHTML="<div class='medal'>"+medal.medal+"</div><div class='score-big' style='color:"+medal.color+"'>"+pct+"%</div><div style='font-size:20px;font-weight:700;margin:8px 0'>"+medal.label+"</div><div style='color:var(--t2);font-size:14px'>"+correct+" / "+total+" bonnes réponses</div><div class='xp-pill'>+"+xp+" XP gagnés</div>";
    w.appendChild(hero);

    // Stats
    const stats=D({cls:"stat-row"});
    [
      {v:correct,l:"Correctes"},
      {v:total-correct,l:"Erreurs"},
      {v:fmtTime(timeUsed),l:"Temps utilisé"},
      {v:DIFFICULTIES[difficulty].label,l:"Difficulté"},
    ].forEach(s=>{
      const sb=D({cls:"stat-box"});
      sb.innerHTML="<div class='sv'>"+s.v+"</div><div class='sl'>"+s.l+"</div>";
      stats.appendChild(sb);
    });
    w.appendChild(stats);

    // Action buttons
    const row=D({style:"display:flex;gap:10px;margin-bottom:20px"});
    row.appendChild(B({cls:"btn-ghost",style:"flex:1",onClick:()=>{
      phase="setup";current=0;answers=[];timeLeft=0;build();
    }},"Recommencer"));
    row.appendChild(B({cls:"btn",style:"flex:1",onClick:()=>{
      // Show review
      reviewEl.style.display=reviewEl.style.display==="none"?"block":"none";
      revBtn.textContent=revBtn.textContent.includes("Voir")?"Masquer la correction":"Voir la correction complète";
    }},"Voir la correction complète"));
    w.appendChild(row);
    const revBtn=row.lastChild;

    // Review section (hidden by default)
    const reviewEl=D({style:"display:none"});
    const revTitle=D({style:"font-size:15px;font-weight:700;margin-bottom:14px;padding-top:6px"});
    revTitle.textContent="Correction détaillée";
    reviewEl.appendChild(revTitle);

    answers.forEach((a,i)=>{
      const ri=D({cls:"review-item"});
      const isCorrect=a.chosen===a.correct;
      const icon=isCorrect?"✅":"❌";
      const qp=D({cls:"review-q"});
      qp.textContent=icon+" Q"+(i+1)+": "+a.q_text;
      ri.appendChild(qp);
      a.opts.forEach((o,oi)=>{
        const op=D({cls:"review-opt "+(oi===a.correct?"correct":oi===a.chosen&&!isCorrect?"wrong":"neutral")});
        op.textContent=(oi===a.correct?"✓ ":oi===a.chosen&&!isCorrect?"✗ ":"")+o;
        ri.appendChild(op);
      });
      if(!isCorrect){
        const exp=D({cls:"review-exp"});
        exp.textContent="💡 "+a.exp;
        ri.appendChild(exp);
      }
      reviewEl.appendChild(ri);
    });
    w.appendChild(reviewEl);
  }

  build();
  return w;
}

// PLAN DE RÉVISION
// ══════════════════════════════════════════════════════════════════════════════
function renderPlan(){
  let phase=lsGet("sai_plan_phase","setup"); // setup | active
  let plan=lsGet("sai_plan",null);
  let checks=lsGet("sai_plan_checks",{});
  let openDays={};

  function build(){

    if(phase==="setup") buildSetup();
    else buildActive();

  // ── SETUP ─────────────────────────────────────────────────────────────────
  function buildSetup(){
    w.appendChild(makeTitle("Plan de révision 📅"));

    // Exam date
    const dc=D({cls:"card"});

    const minDate=new Date(today.getTime()+86400000);

    dateInp.min=minStr;
    dateInp.style.cssText="background:var(--bg3);border:1.5px solid var(--border2);border-radius:8px;color:var(--text);padding:10px 13px;font-size:15px;font-family:inherit;outline:none;width:100%;margin-top:2px";

      const d=new Date(dateInp.value);
      const diff=Math.round((d-new Date())/(1000*60*60*24));
      daysLeft.textContent=diff===1?"1 jour pour réviser":diff+" jours pour réviser";
      daysLeft.style.display="block";
      daysLeft.style.color=diff<3?"var(--red)":diff<7?"#ffb830":"var(--g)";
    });
    dc.appendChild(daysLeft);
    w.appendChild(dc);

    // Matières à réviser

        if(selMats.includes(m.id)){selMats.splice(selMats.indexOf(m.id),1);}
        else selMats.push(m.id);
        b.className="mat-btn"+(selMats.includes(m.id)?" on":"");
        const nm=b.querySelector(".mn");
        if(nm) nm.style.color=selMats.includes(m.id)?"var(--g)":"var(--t2)";
        updateStart();
      }});
      b.innerHTML="<div style='font-size:20px;margin-bottom:4px'>"+m.e+"</div><div class='mn' style='font-size:12px;font-weight:600;color:var(--t2)'>"+m.nom+"</div>";

    });
    mc.appendChild(matGrid);
    w.appendChild(mc);

    // Temps dispo par jour
    const tc=D({cls:"card"});

    hrng.addEventListener("input",e=>{heures=+e.target.value;hval.textContent=hLabels[heures]||heures+"h";});
    tc.appendChild(hlbl);tc.appendChild(hrng);
    w.appendChild(tc);

    const genBtn=B({cls:"btn",disabled:true,style:"width:100%;padding:14px;font-size:16px",
      onClick:async()=>{
        genBtn.disabled=true;
        genBtn.innerHTML="<span class='spinner'></span>Génération de ton plan...";

        const today2=new Date().toISOString().split("T")[0];

        const diff2=Math.round((new Date(examDate)-new Date())/(1000*60*60*24));
        try{
          const txt=await callAI("Tu es un coach scolaire expert. Crée un plan de révision en français québécois pour un lycéen.\n\nInfos:\n- Date aujourd'hui: "+today2+"\n- Date examen: "+examDate+" (dans "+diff2+" jours)\n- Matières: "+matNames+"\n- Temps par jour: "+hLabels[heures]+" ("+heures+" heures)\n\nCrée un plan jour par jour réaliste. Chaque jour a 2-4 tâches concrètes de révision (pas vagues). Les tâches doivent être spécifiques (ex: 'Révise les chapitres 3-4 de chimie: liaisons covalentes', pas juste 'réviser chimie'). Répartis les matières intelligemment. Le dernier jour avant l'exam = révision légère + repos.\n\nJSON UNIQUEMENT:\n{\"examDate\":\""+examDate+"\",\"totalDays\":"+diff2+",\"matieres\":[\""+selMats.join('","')+"\"],\"days\":[{\"date\":\"YYYY-MM-DD\",\"label\":\"Lundi 2 juin\",\"totalMin\":90,\"tasks\":[{\"id\":\"t1\",\"matiere\":\"math\",\"emoji\":\"📐\",\"text\":\"Description tâche concrète\",\"duree\":\"30 min\"}]}]}\n\nIMPORTANT: duree en minutes (ex: '30 min', '45 min'). UNIQUEMENT le JSON.");
          plan=JSON.parse(txt);
          plan.heures=heures;
          plan.examDate=examDate;
          checks={};
          phase="active";
          savePlan();
          build();
        }catch(e){alert("Erreur: "+e.message);genBtn.disabled=false;genBtn.textContent="Générer mon plan →";}
    }});
    genBtn.textContent="Générer mon plan →";
    w.appendChild(genBtn);

    function updateStart(){
      genBtn.disabled=!dateInp.value||selMats.length===0;
    }
  }

  // ── ACTIVE PLAN ────────────────────────────────────────────────────────────
  function buildActive(){
    if(!plan){phase="setup";build();return;}

    // Stats globales
    const allTasks=plan.days.flatMap(d=>d.tasks);
    const totalTasks=allTasks.length;
    const doneTasks=allTasks.filter(t=>checks[t.id]).length;
    const pct=totalTasks>0?Math.round(doneTasks/totalTasks*100):0;

    // Days left
    const daysLeft2=Math.max(0,Math.round((new Date(plan.examDate)-new Date())/(1000*60*60*24)));
    const examLabel=daysLeft2===0?"C'est aujourd'hui! 🎯":daysLeft2===1?"Demain! 🔥":daysLeft2+" jours restants";

    // Header hero
    const hero=D({cls:"plan-hero"});
    // Circle progress
    const size=80,r=32,circ=2*Math.PI*r;
    const offset=circ-(pct/100)*circ;
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("width",size);svg.setAttribute("height",size);
    svg.setAttribute("viewBox","0 0 80 80");
    svg.style.transform="rotate(-90deg)";
    const bgC=document.createElementNS("http://www.w3.org/2000/svg","circle");
    bgC.setAttribute("cx","40");bgC.setAttribute("cy","40");bgC.setAttribute("r",r);
    bgC.setAttribute("fill","none");bgC.setAttribute("stroke","#2a2a2a");bgC.setAttribute("stroke-width","7");
    const fgC=document.createElementNS("http://www.w3.org/2000/svg","circle");
    fgC.setAttribute("cx","40");fgC.setAttribute("cy","40");fgC.setAttribute("r",r);
    fgC.setAttribute("fill","none");fgC.setAttribute("stroke","#7fff6b");fgC.setAttribute("stroke-width","7");
    fgC.setAttribute("stroke-dasharray",circ);fgC.setAttribute("stroke-dashoffset",offset);
    fgC.setAttribute("stroke-linecap","round");
    svg.append(bgC,fgC);
    const ringWrap=D({cls:"plan-progress-ring",style:"position:relative;width:80px;height:80px;flex-shrink:0"});
    ringWrap.appendChild(svg);
    const pctLabel=D({style:"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:800;color:var(--g)"});
    pctLabel.textContent=pct+"%";
    ringWrap.appendChild(pctLabel);
    hero.appendChild(ringWrap);

    const info=D({style:"flex:1"});
    const examD=new Date(plan.examDate).toLocaleDateString("fr-CA",{weekday:"long",day:"numeric",month:"long"});
    info.innerHTML="<div style='font-size:18px;font-weight:800;margin-bottom:4px'>"+examLabel+"</div><div style='font-size:13px;color:var(--t2);margin-bottom:10px'>Examen le "+examD+"</div><div style='font-size:13px;color:var(--t2)'>"+doneTasks+" / "+totalTasks+" tâches complétées</div>";
    hero.appendChild(info);

    const resetBtn=B({cls:"btn-ghost",style:"align-self:flex-start;font-size:12px",onClick:()=>{
      if(confirm("Créer un nouveau plan? Le plan actuel sera effacé.")){
        phase="setup";plan=null;checks={};savePlan();build();
      }
    }});
    resetBtn.textContent="Nouveau plan";
    hero.appendChild(resetBtn);
    w.appendChild(hero);

    // Days list
    const todayStr=new Date().toISOString().split("T")[0];
    plan.days.forEach((day,di)=>{
      const isToday=day.date===todayStr;
      const isPast=day.date<todayStr;
      const dayDone=day.tasks.every(t=>checks[t.id]);
      const dayContainer=D({cls:"plan-day"});
      if(isToday) dayContainer.style.borderColor="var(--g)";

      const hdr=D({cls:"plan-day-hdr",onClick:()=>{
        openDays[di]=!openDays[di];
        body.className="plan-day-body"+(openDays[di]?" open":"");
        arrow.style.transform=openDays[di]?"rotate(90deg)":"rotate(0deg)";
      }});

      const badge=D({cls:"day-badge"});
      badge.textContent=isToday?"Aujourd'hui":isPast?"Passé":"J-"+(Math.round((new Date(day.date)-new Date())/(1000*60*60*24))+1);
      if(isPast&&!dayDone) badge.style.cssText="background:#2a1010;color:var(--red);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;flex-shrink:0";
      if(dayDone) badge.style.cssText="background:var(--gd);color:var(--g);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;flex-shrink:0";

      const titleEl=D({cls:"day-title"});
      titleEl.textContent=(dayDone?"✓ ":"")+day.label;
      if(dayDone) titleEl.style.color="var(--t3)";

      const doneCount=day.tasks.filter(t=>checks[t.id]).length;
      const timeEl=D({cls:"day-time"});
      timeEl.textContent=doneCount+"/"+day.tasks.length+" · "+day.totalMin+" min";

      const arrow=D({cls:"day-arrow"});arrow.textContent="›";
      hdr.append(badge,titleEl,timeEl,arrow);
      dayContainer.appendChild(hdr);

      const body=D({cls:"plan-day-body"});
      // Auto-open today
      if(isToday){openDays[di]=true;body.className="plan-day-body open";arrow.style.transform="rotate(90deg)";}

      day.tasks.forEach(task=>{
        const taskEl=D({cls:"plan-task"});
        const isDone=!!checks[task.id];
        const chk=D({cls:"plan-task-check"+(isDone?" done":""),onClick:()=>{
          checks[task.id]=!checks[task.id];
          savePlan();
          build(); // rebuild for progress update
        }});
        if(isDone) chk.textContent="✓";
        const txt=D({cls:"plan-task-text"+(isDone?" done":"")});
        txt.innerHTML="<span style='margin-right:5px'>"+task.emoji+"</span><strong style='color:"+(isDone?"var(--t3)":"var(--text)")+"'>"+task.matiere+"</strong> — "+task.text+" <span style='color:var(--t3);font-size:11px'>("+task.duree+")</span>";
        taskEl.append(chk,txt);
        body.appendChild(taskEl);
      });
      dayContainer.appendChild(body);
      w.appendChild(dayContainer);
    });
  }

  build();
  return w;
}


// ══════════════════════════════════════════════════════════════════════════════
// PROF IA (CHAT)
// ══════════════════════════════════════════════════════════════════════════════
function renderProf(){
  const userMats=MATIERES.filter(m=>S.user.matieres.includes(m.id));
  let messages=[]; // {role, text, imgFile?}
  let context={notes:"", matiere:userMats[0]?.id||"math", imgFile:null};
  let loading=false;

  const SUGGESTIONS=[
    "Explique-moi ce concept simplement",
    "Fais-moi un résumé rapide",
    "Donne-moi un exemple concret",
    "Quelles sont les erreurs communes?",
    "Crée 3 questions types d'examen",
    "C'est quoi la différence entre les deux?",
  ];

  const w=D({cls:"fade"});

  // Header
  const hdr=D({style:"display:flex;align-items:center;gap:12px;margin-bottom:20px"});
  const avatar=D({style:"width:44px;height:44px;background:var(--gd);border:1.5px solid var(--g);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0"});
  avatar.textContent="🧑‍🏫";
  const hinfo=D({});
  hinfo.innerHTML="<div style='font-size:20px;font-weight:800;letter-spacing:-0.02em'>Prof IA 💬</div><div style='font-size:13px;color:var(--t2)'>Pose n'importe quelle question sur ton cours</div>";
  hdr.append(avatar,hinfo);
  w.appendChild(hdr);

  // Context bar (optional notes)
  const ctxWrap=D({style:"margin-bottom:10px"});
  let ctxImgFile=null;
  let ctxBadge=null;

  function renderCtx(){
    ctxWrap.innerHTML="";
    if(context.notes||ctxImgFile){
      ctxBadge=D({cls:"chat-ctx-badge"});
      ctxBadge.innerHTML="<span>📎 Contexte : "+(ctxImgFile?"Image + ":"")+(context.notes?"Notes ("+context.notes.length+" car.)":"")+"</span>";
      const rm=B({cls:"rm",onClick:()=>{context.notes="";ctxImgFile=null;renderCtx();}});
      rm.textContent="✕";
      ctxBadge.appendChild(rm);
      ctxWrap.appendChild(ctxBadge);
    }
  }

  // Notes collapse panel
  let ctxOpen=false;
  const ctxToggle=B({cls:"chat-tool",style:"margin-bottom:8px",onClick:()=>{
    ctxOpen=!ctxOpen;
    ctxPanel.style.display=ctxOpen?"block":"none";
    ctxToggle.textContent=ctxOpen?"➖ Masquer le contexte":"➕ Ajouter mon cours (optionnel)";
  }});
  ctxToggle.textContent="➕ Ajouter mon cours (optionnel)";
  w.appendChild(ctxToggle);

  const ctxPanel=D({style:"display:none;margin-bottom:10px"});
  const ctxCard=D({cls:"card",style:"padding:14px"});
  ctxCard.appendChild(mk("label",{cls:"lbl"},"Colle tes notes — le prof les utilisera pour mieux t'aider"));
  const ctxTa=TA({placeholder:"Colle ici ton cours, chapitre, ou exercice...",style:"min-height:100px"});
  ctxTa.addEventListener("input",e=>{context.notes=e.target.value;renderCtx();});

  // Paste image in context
  const ctxPhotoRow=D({cls:"photo-bar",style:"margin-top:8px"});
  const ctxFileInp=I({type:"file",accept:"image/*",style:"display:none"});
  ctxFileInp.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;ctxImgFile=f;renderCtx();});
  const ctxFBtn=B({cls:"photo-bar-btn",onClick:()=>ctxFileInp.click()});ctxFBtn.innerHTML="📁 Image";
  const ctxPBtn=B({cls:"photo-bar-btn",onClick:async()=>{
    try{
      const items=await navigator.clipboard.read();
      for(const item of items){
        const imgType=item.types.find(t=>t.startsWith("image/"));
        if(imgType){const blob=await item.getType(imgType);ctxImgFile=new File([blob],"capture.png",{type:imgType});renderCtx();return;}
      }
    }catch(e){}
    chatInput.focus();
  }});
  ctxPBtn.innerHTML="📋 Coller capture";
  ctxPhotoRow.append(ctxFileInp,ctxFBtn,ctxPBtn);
  ctxCard.append(ctxTa,ctxPhotoRow);
  ctxPanel.appendChild(ctxCard);
  w.appendChild(ctxPanel);
  w.appendChild(ctxWrap);

  // Chat container
  const chatWrap=D({cls:"chat-wrap"});
  const msgList=D({cls:"chat-messages"});

  // Welcome message
  function addAIMsg(text,isTyping=false){
    const msg=D({cls:"chat-msg"});
    const av=D({cls:"chat-avatar ai"});av.textContent="🧑‍🏫";
    const bubble=D({cls:"chat-bubble ai"+(isTyping?" typing":"")});
    bubble.textContent=text;
    msg.append(av,bubble);
    msgList.appendChild(msg);
    msgList.scrollTop=msgList.scrollHeight;
    return bubble;
  }

  function addUserMsg(text,imgFile2){
    const msg=D({cls:"chat-msg user"});
    const av=D({cls:"chat-avatar user"});av.textContent="👤";
    const bubble=D({cls:"chat-bubble user"});
    bubble.textContent=text;
    if(imgFile2){
      const img=document.createElement("img");
      img.src=URL.createObjectURL(imgFile2);
      img.className="chat-img-preview";
      bubble.appendChild(img);
    }
    msg.append(av,bubble);
    msgList.appendChild(msg);
    msgList.scrollTop=msgList.scrollHeight;
  }

  addAIMsg("Salut "+S.user.nom+"! Je suis ton prof IA 🧑‍🏫\n\nPose-moi n'importe quelle question sur ton cours — je t'explique clairement, avec des exemples adaptés à ton niveau ("+S.user.niveau+").\n\nTu peux aussi ajouter tes notes ou une photo de ton cours pour que je t'aide encore mieux!");

  // Input area
  const inputWrap=D({cls:"chat-input-wrap"});

  // Image attach for chat
  let chatImgFile=null;
  const chatFileInp=I({type:"file",accept:"image/*",style:"display:none"});
  chatFileInp.addEventListener("change",e=>{
    const f=e.target.files[0];if(!f)return;
    chatImgFile=f;chatImgBadge.style.display="flex";
    chatImgBadge.querySelector("span").textContent="📎 "+f.name.slice(0,20);
  });

  const attachBtn=B({style:"background:var(--bg3);border:1.5px solid var(--border2);border-radius:8px;width:40px;height:40px;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s",
    onClick:()=>chatFileInp.click()});
  attachBtn.textContent="📎";
  attachBtn.title="Joindre une image ou capture d'écran";

  const chatInput=TA({cls:"chat-input",placeholder:"Pose ta question ici... (Entrée pour envoyer, Shift+Entrée pour nouvelle ligne)"});

  // Paste image directly in chat input
  chatInput.addEventListener("paste",ev=>{
    const items2=[...(ev.clipboardData?.items||[])];
    const imgItem=items2.find(i=>i.type.startsWith("image/"));
    if(imgItem){ev.preventDefault();chatImgFile=imgItem.getAsFile();chatImgBadge.style.display="flex";chatImgBadge.querySelector("span").textContent="📎 Capture collée";}
  });

  chatInput.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}
  });
  chatInput.addEventListener("input",()=>{
    chatInput.style.height="auto";
    chatInput.style.height=Math.min(chatInput.scrollHeight,120)+"px";
    sendBtn.disabled=chatInput.value.trim().length===0||loading;
  });

  const sendBtn=B({cls:"chat-send",disabled:true,onClick:sendMsg});
  sendBtn.textContent="↑";

  // Image badge above input
  const chatImgBadge=D({style:"display:none;align-items:center;gap:6px;background:var(--gd);border:1px solid var(--g2);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--g);margin-bottom:6px"});
  const badgeSpan=mk("span",{},"📎 Image");
  const badgeRm=B({style:"background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:0"});
  badgeRm.textContent="✕";
  badgeRm.addEventListener("click",()=>{chatImgFile=null;chatImgBadge.style.display="none";});
  chatImgBadge.append(badgeSpan,badgeRm);

  inputWrap.append(chatFileInp,attachBtn,chatInput,sendBtn);

  // Suggestions
  const sugg=D({cls:"chat-tools",style:"flex-wrap:wrap"});
  SUGGESTIONS.forEach(s2=>{
    const b=B({cls:"chat-tool",onClick:()=>{chatInput.value=s2;chatInput.dispatchEvent(new Event("input"));sendBtn.disabled=false;chatInput.focus();}});
    b.textContent=s2;sugg.appendChild(b);
  });

  chatWrap.append(msgList,sugg,chatImgBadge,inputWrap);
  w.appendChild(chatWrap);

  async function sendMsg(){
    const text=chatInput.value.trim();
    if(!text&&!chatImgFile||loading)return;
    const sentImg=chatImgFile;
    chatInput.value="";chatInput.style.height="auto";
    chatImgFile=null;chatImgBadge.style.display="none";
    sendBtn.disabled=true;loading=true;

    addUserMsg(text,sentImg);
    messages.push({role:"user",content:text,hasImg:!!sentImg});

    // Typing indicator
    const typingBubble=addAIMsg("...",true);

    try{
      // Build system prompt
      let sys="Tu es un professeur expert et bienveillant pour lycéens québécois ("+S.user.niveau+"). Tu expliques clairement, avec des exemples concrets. Tu utilises un langage simple et encourageant. Réponds en français québécois naturel. Sois concis mais complet (max 300 mots). Utilise des emojis avec parcimonie pour rendre la réponse plus lisible.";
      if(context.notes) sys+="\n\nContexte (notes du cours de l'élève):\n"+context.notes.slice(0,2000);

      // Build conversation history for context
      const hist=messages.slice(-6).map(m=>({role:m.role,content:m.content}));

      let aiResponse;
      if(sentImg||ctxImgFile){
        // Use vision model with image
        const imgToSend=sentImg||ctxImgFile;
        const b64=await fileToB64(imgToSend);
        const mime=imgToSend.type||"image/jpeg";
        const pr=await fetch("/api/ai",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            model:"vision",
            prompt:text||(sentImg?"Explique ce que tu vois dans cette image et aide-moi à comprendre.":"Analyse cette image."),
            image:{data:b64,mime},
            system:sys
          })
        });
        const pd=await pr.json();
        if(pd.error)throw new Error(pd.error);
        aiResponse=pd.result;
      } else {
        const pr=await fetch("/api/ai",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            model:"chat",
            system:sys,
            messages:hist
          })
        });
        const pd=await pr.json();
        if(pd.error)throw new Error(pd.error);
        aiResponse=pd.result;
      }

      messages.push({role:"assistant",content:aiResponse});
      typingBubble.textContent=aiResponse;
      typingBubble.classList.remove("typing");

    }catch(e){
      typingBubble.textContent="Oups! Erreur: "+e.message;
      typingBubble.classList.remove("typing");
    }
    loading=false;
    sendBtn.disabled=chatInput.value.trim().length===0;
    msgList.scrollTop=msgList.scrollHeight;
  }

  return w;
}


// ══════════════════════════════════════════════════════════════════════════════
// RAPPORT DE PROGRÈS
// ══════════════════════════════════════════════════════════════════════════════
function renderRapport(){
  const w = D({cls:"fade"});
  const sessions = S.sessions;
  const matMap = Object.fromEntries(MATIERES.map(m=>[m.id,m]));
  const userMats = MATIERES.filter(m=>S.user.matieres.includes(m.id));

  w.appendChild(makeTitle("Mes progrès 📊"));
  w.appendChild(makeSub("Tes stats de révision en un coup d'oeil."));

  if(sessions.length === 0){
    const es = D({cls:"empty-state"});
    es.innerHTML = "<div class='ei'>📚</div><div>Aucune session encore.<br>Commence par un quiz ou des flashcards!</div>";
    const startBtn = B({cls:"btn", style:"margin-top:16px", onClick:()=>go("quiz")});
    startBtn.textContent = "Commencer maintenant →";
    es.appendChild(startBtn);
    w.appendChild(es);
    return w;
  }

  // ── STATS GLOBALES ──────────────────────────────────────────────────────
  const totalSessions = sessions.length;
  const quizSessions = sessions.filter(s=>s.type==="quiz"||s.type==="exam");
  const avgScore = quizSessions.filter(s=>s.score!=null).length > 0
    ? Math.round(quizSessions.filter(s=>s.score!=null).reduce((a,b)=>a+(b.score||0),0)/quizSessions.filter(s=>s.score!=null).length)
    : null;

  // Streak: consecutive days with at least one session
  const daySet = new Set(sessions.map(s=>s.date.slice(0,10)));
  let streak = 0;
  const today = new Date();
  for(let i=0;i<365;i++){
    const d = new Date(today.getTime()-i*86400000).toISOString().slice(0,10);
    if(daySet.has(d)) streak++;
    else if(i>0) break;
  }

  // XP total (10 per session, bonus for exam score)
  const xp = sessions.reduce((acc,s)=>{
    if(s.type==="exam"&&s.score!=null) return acc+Math.round(s.score*0.5);
    return acc+10;
  },0);

  const hero = D({cls:"rp-hero"});
  [
    {v:totalSessions, l:"Sessions totales", i:"📚"},
    {v:streak+"🔥", l:"Jours de suite", i:null},
    {v:avgScore!=null?avgScore+"%":"—", l:"Score moyen exam", i:"🎯"},
    {v:xp+" XP", l:"Points gagnés", i:"⭐"},
  ].forEach(s=>{
    const c = D({cls:"rp-stat"});
    c.innerHTML = "<div class='rv'>"+s.v+"</div><div class='rl'>"+s.l+"</div>";
    hero.appendChild(c);
  });
  w.appendChild(hero);

  // ── ACTIVITÉ 7 DERNIERS JOURS ───────────────────────────────────────────
  const sec1 = D({cls:"rp-section"});
  const t1 = D({cls:"rp-section-title"});
  t1.innerHTML = "📅 Activité des 7 derniers jours";
  sec1.appendChild(t1);

  const weekGrid = D({cls:"week-grid"});
  const dayNames = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  for(let i=6;i>=0;i--){
    const d = new Date(today.getTime()-i*86400000);
    const dStr = d.toISOString().slice(0,10);
    const count = sessions.filter(s=>s.date.slice(0,10)===dStr).length;
    const isToday = i===0;
    const wd = D({cls:"week-day "+(isToday?"today":count>0?"active":"empty")});
    wd.innerHTML = "<div>"+dayNames[d.getDay()===0?6:d.getDay()-1]+"</div><div style='font-size:12px;font-weight:700'>"+(count||"")+"</div>";
    if(count>0&&!isToday) wd.title = count+" session"+(count>1?"s":"");
    weekGrid.appendChild(wd);
  }
  sec1.appendChild(weekGrid);
  w.appendChild(sec1);

  // ── PAR MATIÈRE ──────────────────────────────────────────────────────────
  const matCounts = userMats.map(m=>({
    mat:m,
    count:sessions.filter(s=>s.matiere===m.id).length
  })).filter(x=>x.count>0).sort((a,b)=>b.count-a.count);

  if(matCounts.length > 0){
    const sec2 = D({cls:"rp-section"});
    const t2 = D({cls:"rp-section-title"});
    t2.innerHTML = "📐 Temps par matière";
    sec2.appendChild(t2);
    const max = matCounts[0].count;
    matCounts.forEach(({mat,count})=>{
      const row = D({cls:"bar-row"});
      const lbl = D({cls:"bar-label"});lbl.textContent=mat.e+" "+mat.nom;
      const track = D({cls:"bar-track"});
      const fill = D({cls:"bar-fill"});
      fill.style.width="0%";
      track.appendChild(fill);
      const val = D({cls:"bar-val"});val.textContent=count;
      row.append(lbl,track,val);
      sec2.appendChild(row);
      setTimeout(()=>{fill.style.width=Math.round(count/max*100)+"%";},50);
    });

    // Tip: which subject needs more work
    const least = [...matCounts].sort((a,b)=>a.count-b.count)[0];
    if(matCounts.length>1&&least){
      const tip = D({cls:"rp-tip",style:"margin-top:14px"});

    // Trend
